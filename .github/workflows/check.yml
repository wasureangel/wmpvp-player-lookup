name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: node --test tests/node-release.test.mjs
      - run: bash -n deploy/ubuntu/update.sh
  legacy-python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r legacy/python/requirements.txt
      - run: python -m unittest discover -s legacy/python/tests -p '*.py'
