name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - run: npm run test:runtime
      - run: python tests/local_web.py
      - run: npm run build
      - run: npx wrangler pages functions build --outdir=.wrangler/compiled
      - run: npm audit --audit-level=high
